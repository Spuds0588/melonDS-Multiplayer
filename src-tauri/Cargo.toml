[package]
name = "melonDS-Multiplayer"
version = "0.1.0"
description = "DS emulator with splitscreen multiplayer support"
authors = ["melonDS-Multiplayer Team"]
edition = "2021"

[lib]
name = "melondSMultiplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.0"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["fs", "cors"] }
uuid = { version = "1.0", features = ["v4"] }
parking_lot = "0.12"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
