[package]
name = "melonDS-Multiplayer"
version = "0.1.5-alpha.3"
description = "DS emulator with splitscreen multiplayer support"
authors = ["melonDS-Multiplayer Team"]
edition = "2021"

[lib]
name = "melondSMultiplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["fs", "cors"] }
uuid = { version = "1.0", features = ["v4"] }
parking_lot = "0.12"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

# Crash forensics for the native side: sigaction/sigaltstack/backtrace so a
# segfault in the C++ core leaves a stack trace behind instead of a silently
# vanished window (see install_crash_handlers).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
