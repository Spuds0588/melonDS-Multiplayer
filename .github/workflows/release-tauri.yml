# Alpha release: the desktop app, built on all three operating systems and
# published as a GitHub pre-release.
#
# Why CI does this and a developer machine cannot: the Tauri host links against
# a C++ core built by CMake (see BUILD.md), and that core has to be compiled by
# each target's own toolchain - MSVC on Windows, AppleClang on macOS, GCC on
# Linux. Tags matching `v*-alpha*` and manual runs both go through the same
# three jobs, so an alpha is never assembled from one platform's guess about
# another's link line (src-tauri/build.rs carries the per-platform half).
#
# The Linux job also runs the core smoke test before packaging: it is the only
# job cheap enough to do so, and it is the gate that says the bridge a release
# is built around actually boots a console.
name: Alpha release

on:
  push:
    tags:
      - "v*-alpha*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            bundles: appimage,deb
          - os: macos-14
            name: macos-arm64
            bundles: dmg
          - os: windows-latest
            name: windows-x86_64
            bundles: nsis,msi

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Tauri host needs webkit2gtk-4.1 (Tauri v2), plus the usual
      # packaging tools AppImage/deb bundling shells out to.
      - name: Install Linux packaging dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 rpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      # Windows needs two things the other two platforms do not:
      #
      #  * <dirent.h>. The core uses it for directory walks and MSVC has none;
      #    the project's own manifest already answers that with vcpkg's dirent
      #    port (`vcpkg.json`, platform windows), and the core looks for it in
      #    DIRENT_INCLUDE_DIRS. Only that header-only port is installed here -
      #    the full manifest would pull in Qt, which this build does not use.
      #  * clang-cl rather than cl.exe. The project's own Windows presets
      #    (CMakePresets.json `base-windows`) compile with clang for exactly the
      #    reason this job found: parts of the core use GCC/Clang builtins
      #    (`__builtin_trap`, `__aligned__`) and C++20 designated initializers,
      #    which MSVC rejects at /std:c++17. clang-cl emits MSVC-ABI objects and
      #    links with MSVC's linker, so the Rust MSVC toolchain still links it.
      - name: Install the dirent header (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # --classic: the repo's vcpkg.json puts vcpkg in manifest mode, where
          # a single-port install is refused (and the manifest would pull Qt).
          vcpkg install --classic dirent:x64-windows
          echo "DIRENT_INCLUDE_DIRS=C:/vcpkg/installed/x64-windows/include" >> "$GITHUB_ENV"

      # The MSVC environment (INCLUDE/LIB/PATH) that clang-cl needs for the
      # Windows headers and the import libraries. The action also turns on a
      # developer shell for whatever Visual Studio the runner image carries,
      # which is why the generator is Ninja rather than a version-named Visual
      # Studio generator (the image's VS major version changes between images).
      - name: Set up the MSVC environment (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check the Windows compiler
        if: matrix.os == 'windows-latest'
        run: clang-cl --version

      # The C++ core + the multiplayer bridge. Exactly the BUILD.md line, so a
      # local build and a release build are the same build.
      - name: Configure the core
        shell: bash
        run: |
          args=()
          if [ -n "${DIRENT_INCLUDE_DIRS:-}" ]; then
            args+=("-DDIRENT_INCLUDE_DIRS=$DIRENT_INCLUDE_DIRS")
            # Ninja + clang-cl: the compiler the project's own Windows presets
            # use, with the MSVC ABI and linker the Rust toolchain expects.
            args+=("-G" "Ninja" "-DCMAKE_C_COMPILER=clang-cl" "-DCMAKE_CXX_COMPILER=clang-cl")
            # clang-cl's LTO output is LLVM bitcode, which needs lld-link and
            # llvm-lib to archive and link. Turning IPO off for this job keeps
            # the Windows link on the same MSVC-compatible path Rust uses; the
            # core is not slower in any way this app can measure.
            args+=("-DENABLE_LTO_RELEASE=OFF" "-DENABLE_LTO=OFF")
          fi
          cmake -S . -B build-tauri \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_QT_SDL=OFF \
            -DBUILD_TAURI_BRIDGE=ON \
            -DENABLE_OGLRENDERER=OFF \
            "${args[@]}"

      - name: Build the core and the bridge
        run: cmake --build build-tauri --config Release --parallel

      # The test ROM is generated, not committed (a ROM in the tree is a ROM
      # nobody may redistribute): build it first, then run the gate.
      - name: Smoke-test the core (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          python3 tools/mkdiagrom/mkdiagrom.py --output tools/mkdiagrom/diag.nds
          ./build-tauri/md_smoke_test tools/mkdiagrom/diag.nds

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the app bundle
        run: cargo tauri build --bundles ${{ matrix.bundles }}
        working-directory: src-tauri
        env:
          # macOS signing/notarisation: an alpha is unsigned on purpose. The
          # flag keeps the bundler from looking for an identity that is not
          # there, which would otherwise fail the job.
          CI: "true"
          APPLE_SIGNING_IDENTITY: "-"

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle -type f \
            \( -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" \
               -o -name "*.msi" -o -name "*.exe" \) -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: melonDS-Multiplayer-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish the pre-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what will be published
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: artifacts/**/*
